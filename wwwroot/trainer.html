<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>FitnessCoach – Trainer Dashboard (macOS Style)</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    /* Week days selector Apple Style */
    .days-slider {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 24px;
    }
    .days-slider .day-pill {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      border-radius: var(--radius-lg);
      background: var(--apple-card);
      border: 1px solid var(--apple-line);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .days-slider .day-pill:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .days-slider .day-pill b {
      display: block;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2px;
    }
    .days-slider .day-pill .dots {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-top: 6px;
    }
    .days-slider .day-pill.active {
      background: #1D1D1F;
      color: #FFFFFF;
      border-color: #1D1D1F;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .nav-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--apple-line);
      background: var(--apple-card);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      color: var(--apple-secondary);
      transition: all 0.15s;
    }
    .nav-arrow:hover {
      color: var(--apple-ink);
      background: #F8F8FA;
    }

    /* Feed & Meal Card Apple Style */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 980px;
    }
    .meal-card {
      display: grid;
      grid-template-columns: 180px 180px 1fr 220px;
      gap: 20px;
      align-items: center;
      padding: 20px 24px;
    }
    .who {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .time-badge {
      font-size: 11.5px;
      color: var(--apple-secondary);
      font-weight: 400;
    }
    .meal-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--apple-blue);
      background: var(--apple-blue-soft);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      align-self: flex-start;
    }
    .ing-list {
      font-size: 13px;
    }
    .ing-list li {
      list-style: none;
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid var(--apple-line);
      color: var(--apple-ink);
    }
    .ing-list li:last-child {
      border: none;
    }
    .ing-list .total-row {
      font-weight: 700;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
    }
    .meal-photo {
      height: 140px;
      width: 100%;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
    }
    .meal-photo::after {
      content: " Verified Meal";
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }
    .signalr-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--apple-green-soft);
      color: #248A3D;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34C759;
      box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7);
      animation: pulseLive 1.8s infinite;
    }
    @keyframes pulseLive {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 199, 89, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- macOS Sidebar -->
  <aside class="side" id="s"></aside>

  <!-- Main Content -->
  <main class="main">
    <div class="top">
      <div>
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
          <h1>Cronologie Calorii</h1>
          <div class="signalr-indicator">
            <span class="live-dot"></span> Live Sync Active
          </div>
        </div>
        <div class="sub">Monitorizare live în timp real a tuturor meselor postate de clienți</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn" id="todayMealsCount">Mese postate azi: <b>3</b></button>
        <button class="btn primary">Toți clienții (12) ▾</button>
      </div>
    </div>

    <!-- Apple Calendar Style Day Selector -->
    <div class="days-slider">
      <div class="nav-arrow">‹</div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Joi</span>
        <b>12</b>
        <div class="dots"><i class="dot" style="background:var(--apple-green)"></i><i class="dot" style="background:var(--apple-green)"></i></div>
      </div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Vin</span>
        <b>13</b>
        <div class="dots"><i class="dot" style="background:var(--apple-green)"></i><i class="dot" style="background:var(--apple-green)"></i></div>
      </div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Sâm</span>
        <b>14</b>
        <div class="dots"><i class="dot" style="background:var(--apple-orange)"></i><i class="dot" style="background:var(--apple-green)"></i></div>
      </div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Dum</span>
        <b>15</b>
        <div class="dots"><i class="dot" style="background:var(--apple-red)"></i><i class="dot" style="background:var(--apple-green)"></i></div>
      </div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Lun</span>
        <b>16</b>
        <div class="dots"><i class="dot" style="background:var(--apple-green)"></i><i class="dot" style="background:var(--apple-green)"></i></div>
      </div>
      <div class="day-pill">
        <span style="font-size:11.5px; color:var(--apple-secondary);">Mar</span>
        <b>17</b>
        <div class="dots"><i class="dot" style="background:var(--apple-green)"></i><i class="dot" style="background:var(--apple-orange)"></i></div>
      </div>
      <div class="day-pill active">
        <span style="font-size:11.5px; color:rgba(255,255,255,0.7);">Azi</span>
        <b>18</b>
        <div class="dots"><i class="dot" style="background:#34C759"></i><i class="dot" style="background:#34C759"></i><i class="dot" style="background:#34C759"></i></div>
      </div>
      <div class="nav-arrow">›</div>
    </div>

    <!-- Live Activity Feed -->
    <div class="feed" id="feed"></div>
  </main>
</div>

<script>
  document.getElementById('s').innerHTML = sidebar('calorii');
  const feed = document.getElementById('feed');
  let totalMeals = 0;

  function renderMealCard(meal, isNew = false) {
    totalMeals++;
    document.getElementById('todayMealsCount').innerHTML = `Mese postate azi: <b>${totalMeals}</b>`;

    const card = document.createElement('div');
    card.className = `card meal-card ${isNew ? 'new-card-anim' : ''}`;
    const ringId = 'ring_' + Math.random().toString(36).substr(2, 9);

    const itemsHtml = meal.items && meal.items.length > 0 
      ? meal.items.map(item => `
          <li>
            <span>${item.name} <span style="color:var(--apple-secondary); font-size:12px;">· ${item.grams}g</span></span>
            <span style="font-weight:600;">${item.kcal} kcal</span>
          </li>
        `).join('')
      : `<li><span>Masa clientului</span><span style="font-weight:600;">${meal.totalKcal} kcal</span></li>`;

    const photoStyle = meal.photoUrl 
      ? `style="background-image: url('${meal.photoUrl}')"` 
      : `style="background: linear-gradient(135deg, #cbd5e1, #94a3b8)"`;

    card.innerHTML = `
      <div class="who">
        <div style="display:flex; align-items:center; gap:10px;">
          ${av(meal.clientName)}
          <div>
            <div style="font-weight:700; font-size:14px; color:var(--apple-ink);">${meal.clientName}</div>
            <div class="time-badge">${meal.time}</div>
          </div>
        </div>
        <span class="meal-tag">${meal.mealType}</span>
      </div>

      <div style="display:flex; justify-content:center; align-items:center;">
        <div id="${ringId}"></div>
      </div>

      <div class="ing-list">
        <ul>${itemsHtml}</ul>
        <div class="total-row">
          <span>Total masă</span>
          <span style="color:var(--apple-green); font-size:14px;">${meal.totalKcal} kcal</span>
        </div>
        <div style="display:flex; gap:14px; margin-top:8px; font-size:11.5px; color:var(--apple-secondary);">
          <span><i class="dot" style="background:#0A84FF"></i> P <b>${meal.protein || 45}g</b></span>
          <span><i class="dot" style="background:#FF9F0A"></i> C <b>${meal.carbs || 60}g</b></span>
          <span><i class="dot" style="background:#FF375F"></i> G <b>${meal.fat || 18}g</b></span>
        </div>
      </div>

      <div class="meal-photo" ${photoStyle}></div>
    `;

    if (isNew && feed.firstChild) {
      feed.insertBefore(card, feed.firstChild);
    } else {
      feed.appendChild(card);
    }

    ring(document.getElementById(ringId), {
      size: 130,
      kcal: meal.consumedKcal,
      target: meal.targetKcal,
      p: meal.protein || 45,
      c: meal.carbs || 60,
      f: meal.fat || 18
    });
  }

  // Load existing meals
  async function loadInitialMeals() {
    try {
      const res = await fetch('/api/meals');
      const data = await res.json();
      data.forEach(m => renderMealCard(m, false));
    } catch (e) {
      console.error(e);
    }
  }
  loadInitialMeals();

  // SignalR Realtime connection
  const connection = new signalR.HubConnectionBuilder()
    .withUrl("/hubs/meals")
    .withAutomaticReconnect()
    .build();

  connection.on("MealAdded", (newMeal) => {
    renderMealCard(newMeal, true);
    showToast(` ${newMeal.clientName} a înregistrat ${newMeal.mealType} (${newMeal.totalKcal} kcal)`);
  });

  connection.start()
    .then(() => console.log("SignalR Connected (Apple Style)"))
    .catch(err => console.error("SignalR Error:", err));
</script>
</body>
</html>
