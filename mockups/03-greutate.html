<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>Greutate – antrenor</title>
<link rel="stylesheet" href="style.css"><script src="common.js"></script>
<style>
.list{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.w .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.w .stats{display:flex;gap:18px;font-size:12px;color:var(--muted)}
.w .stats b{display:block;font-size:17px;color:var(--ink)}
.next{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
</style></head><body>
<div class="app"><aside class="side" id="s"></aside>
<main class="main">
  <div class="top"><div><h1>Greutate</h1><div class="sub">Evoluția la fiecare cântărire · ultimele 12 săptămâni</div></div>
  <div class="row"><button class="btn">4 săpt.</button><button class="btn primary">12 săpt.</button><button class="btn">1 an</button></div></div>
  <div class="list" id="l"></div>
</main></div>
<script>
document.getElementById('s').innerHTML=sidebar('greutate');
const C=[
 {n:'Andrei',last:85.0,start:79.2,goal:86,next:'Vin, 20 nov',data:[79.2,79.6,80.3,81,81.8,82.5,83.1,83.6,84.1,84.4,84.8,85]},
 {n:'Paul',last:85.0,start:84.1,goal:84,next:'Joi, 19 nov',data:[84.1,84.8,85.6,85.9,85.2,84.6,84.5,85.1,85.8,86.2,85.7,85]},
 {n:'Denis',last:82.4,start:89.5,goal:80,next:'Azi ✓',data:[89.5,89.4,89.6,87.2,87.1,88.1,88.0,87.9,85.1,85.0,83.0,82.4]},
 {n:'Angelica',last:61.3,start:66.8,goal:60,next:'Lun, 23 nov',data:[66.8,66.5,65.9,65.4,64.6,64.1,63.5,63.1,62.6,62.1,61.8,61.3]},
];
function spark(d,goal){const W=520,H=130,mn=Math.min(...d,goal)-1,mx=Math.max(...d,goal)+1;
 const x=i=>10+i*(W-20)/(d.length-1), y=v=>H-8-(v-mn)/(mx-mn)*(H-20);
 const pts=d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="#16a34a" stroke-dasharray="5 5" opacity=".6"/><text x="${W-4}" y="${y(goal)-5}" text-anchor="end" font-size="11" fill="#16a34a">țintă ${goal} kg</text>
 <polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#fff" stroke="#2563eb" stroke-width="2"/>`).join('')}</svg>`}
const l=document.getElementById('l');
C.forEach(c=>{const diff=(c.last-c.start).toFixed(1);const e=document.createElement('div');e.className='card w';
 e.innerHTML=`<div class="hd"><div class="row">${av(c.n)}<b>${c.n}</b></div><button class="btn">📅 Programează cântărire</button></div>
 <div class="stats"><div>Ultima cântărire<b>${c.last.toFixed(1).replace('.',',')} kg</b></div><div>De la început<b style="color:${diff<0?'var(--ok)':'#2563eb'}">${diff>0?'+':''}${diff.replace('.',',')} kg</b></div><div>Țintă<b>${c.goal} kg</b></div></div>
 ${spark(c.data,c.goal)}<div class="next"><span>Următoarea cântărire: <b>${c.next}</b></span><span>Click pe nume → pagina clientului</span></div>`;l.appendChild(e)});
</script>
</body></html>
